<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LinkedIn Job Filter</title>
    <style>
      :root {
        --bg: #f8fafb;
        --card: #ffffff;
        --text: #1b1f23;
        --muted: #5c6f7c;
        --border: #dde3e8;
        --accent: #0a66c2;
        --danger: #cc1016;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        max-width: 380px;
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 13px;
        color: var(--text);
        background: var(--bg);
      }

      header {
        padding: 14px 16px 10px;
        background: var(--card);
        border-bottom: 1px solid var(--border);
      }

      header h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
      }

      header p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      main {
        padding: 12px 16px 16px;
      }

      .count {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 12px;
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      li {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      .meta {
        min-width: 0;
        flex: 1;
      }

      .name {
        font-weight: 600;
        word-break: break-word;
      }

      .date {
        margin-top: 2px;
        color: var(--muted);
        font-size: 11px;
      }

      button.unblock {
        flex-shrink: 0;
        padding: 4px 10px;
        font-size: 12px;
        font-weight: 600;
        color: var(--danger);
        background: #fff;
        border: 1px solid #e7b4b4;
        border-radius: 4px;
        cursor: pointer;
      }

      button.unblock:hover {
        background: #fff0f0;
      }

      .empty {
        padding: 20px 12px;
        text-align: center;
        color: var(--muted);
        background: var(--card);
        border: 1px dashed var(--border);
        border-radius: 8px;
      }

      footer {
        padding: 0 16px 14px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.45;
      }

      footer a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Empresas bloqueadas</h1>
      <p>Las ofertas de estas empresas se ocultan en LinkedIn Jobs.</p>
    </header>
    <main>
      <p class="count" id="count"></p>
      <div id="list-root">
        <p class="empty">Cargando…</p>
      </div>
    </main>
    <footer>
      La ocultación es solo en tu navegador. LinkedIn puede seguir sirviendo anuncios;
      esta extensión no bloquea la red.
    </footer>
    <script src="lib/company.js"></script>
    <script src="lib/storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
