<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LinkedIn Job Filter</title>
    <style>
      :root {
        --bg: #f8fafb;
        --card: #ffffff;
        --text: #1b1f23;
        --muted: #5c6f7c;
        --border: #dde3e8;
        --accent: #0a66c2;
        --danger: #cc1016;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        max-width: 380px;
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 13px;
        color: var(--text);
        background: var(--bg);
      }

      header {
        padding: 14px 16px 10px;
        background: var(--card);
        border-bottom: 1px solid var(--border);
      }

      header h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
      }

      header p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      main {
        padding: 12px 16px 16px;
      }

      .count {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 12px;
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      li {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      .logo-wrap {
        flex-shrink: 0;
        width: 36px;
        height: 36px;
        border-radius: 6px;
        overflow: hidden;
        background: #eef3f8;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .logo-wrap img.logo {
        width: 36px;
        height: 36px;
        object-fit: cover;
        display: block;
      }

      .logo-fallback {
        font-size: 14px;
        font-weight: 700;
        color: var(--accent);
      }

      a.name {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
        word-break: break-word;
      }

      a.name:hover {
        text-decoration: underline;
      }

      .meta {
        min-width: 0;
        flex: 1;
      }

      .name {
        font-weight: 600;
        word-break: break-word;
      }

      .date {
        margin-top: 2px;
        color: var(--muted);
        font-size: 11px;
      }

      button.unblock {
        flex-shrink: 0;
        padding: 4px 10px;
        font-size: 12px;
        font-weight: 600;
        color: var(--danger);
        background: #fff;
        border: 1px solid #e7b4b4;
        border-radius: 4px;
        cursor: pointer;
      }

      button.unblock:hover {
        background: #fff0f0;
      }

      .empty {
        padding: 20px 12px;
        text-align: center;
        color: var(--muted);
        background: var(--card);
        border: 1px dashed var(--border);
        border-radius: 8px;
      }

      footer {
        padding: 0 16px 14px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.45;
      }

      footer a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Empresas bloqueadas</h1>
      <p>Las ofertas de estas empresas se ocultan en LinkedIn Jobs.</p>
    </header>
    <main>
      <p class="count" id="count"></p>
      <div id="list-root">
        <p class="empty">Cargando…</p>
      </div>
      <section class="settings" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);">
        <label style="display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.4;cursor:pointer;">
          <input type="checkbox" id="opt-dismiss" style="margin-top:2px;" />
          <span>
            <strong>Usar dismiss nativo de LinkedIn</strong> (opt-in, experimental).
            Tras bloquear, intenta descartar ofertas visibles con la misma petición same-origin
            que LinkedIn. Requiere haber capturado antes un dismiss nativo (⋯ → Descartar) con
            <code>ljfDebug=1</code>.
          </span>
        </label>
        <p id="dismiss-status" style="margin:8px 0 0;font-size:11px;color:var(--muted);"></p>
      </section>
    </main>
    <footer>
      La ocultación es solo en tu navegador (DOM). LinkedIn puede seguir sirviendo anuncios;
      esta extensión no bloquea la red ni guarda cookies.
    </footer>
    <script src="lib/company.js"></script>
    <script src="lib/storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
